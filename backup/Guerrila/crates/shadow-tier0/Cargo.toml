[package]
name = "shadow-tier0"
version = "0.1.0"
edition.workspace = true

[features]
default = []
guerrila_profile = ["shadow-core/guerrila_profile"]
public_lane = ["shadow-core/public_lane"]
harmonic_lane = ["shadow-core/harmonic_lane"]
dpdk = []

[dependencies]
shadow-core = { path = "../shadow-core" }
shadow-control = { path = "../shadow-control" }
shadow-ipc = { path = "../shadow-ipc" }
shadow-egress-jito = { path = "../shadow-egress-jito" }
shadow-harmonic = { path = "../shadow-harmonic" }
shadow-ingest = { path = "../shadow-ingest" }
yellowstone-grpc-proto = "12.1"
yellowstone-grpc-client = "12.1"
tokio = { version = "1", features = ["rt"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10.8"
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.24"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "shadow-tier0"
path = "src/main.rs"

[[bin]]
name = "g4-ingress-seal"
path = "src/bin/g4_ingress_seal.rs"

[[bin]]
name = "g4-shred-replay"
path = "src/bin/g4_shred_replay.rs"

[[bin]]
name = "build-g4-corpus"
path = "src/bin/build_g4_corpus.rs"

[[bin]]
name = "write-allowlist"
path = "src/bin/write_allowlist.rs"

[[bin]]
name = "shadowguard-template-proof"
path = "src/bin/shadowguard_template_proof.rs"

[[bin]]
name = "dpdk-supported-path-latency-probe"
path = "src/bin/dpdk_supported_path_latency_probe.rs"
