[package]
name = "shadow-core"
version = "0.1.0"
edition.workspace = true

[features]
default = []
guerrila_profile = []
public_lane = []
harmonic_lane = []

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10.8"
shadow-ipc = { path = "../shadow-ipc" }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
shadow-harmonic = { path = "../shadow-harmonic" }
