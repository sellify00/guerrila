[package]
name = "shadow-egress-tpu"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "shadow-egress-tpu"
path = "src/main.rs"

[lib]
name = "shadow_egress_tpu"
path = "src/lib.rs"

[dependencies]
shadow-core = { path = "../shadow-core" }
shadow-ipc = { path = "../shadow-ipc" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bs58 = "0.5"
solana-connection-cache = "2.2"
solana-quic-client = "2.2"

[dev-dependencies]
tempfile = "3"
crossbeam-channel = "0.5"
solana-keypair = "2.2"
solana-net-utils = "2.2"
solana-streamer = "2.2"
