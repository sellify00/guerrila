[package]
name = "shadow-control"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "shadow-control"
path = "src/main.rs"

[dependencies]
shadow-ipc = { path = "../shadow-ipc" }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
